# Cogan build engine used by .github/workflows/rothko-gki-builder.yml.
# The rothko kernel runs cogan17/Cogan's build.sh at exactly this commit with
# TARGET_DEVICE=rothko (patches, pins, GKID parity and the KMI gate live there).
# Raise COGAN_COMMIT only through a pull request to dev/rothko, after the new
# Cogan dev commit passed its own checks; older builds stay reproducible.
COGAN_REPO=cogan17/Cogan
# cogan17/Cogan#86 squash merge on dev (2026-10-16): KMI gate also holds the build against
# the rothko stock kernel (ACK android14-6.1-2025-06_r11, 6.1.138), fetched at its pinned commit.
COGAN_COMMIT=a406e33a66f4820fbbb69d43b576463171142e19
