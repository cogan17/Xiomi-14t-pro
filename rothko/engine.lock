# Build engine used by .github/workflows/rothko-gki-builder.yml (D-021).
# The engine is this repository's own branch rothko-engine: a copy of the Cogan
# engine (cogan17/Cogan d9cbc9f, with history) that rothko work changes without
# touching the Cogan repository. build.sh runs at exactly ENGINE_COMMIT with
# TARGET_DEVICE=rothko. Raise ENGINE_COMMIT only through a pull request to
# dev/rothko, after the rothko-engine pull request passed its checks.
ENGINE_REPO=cogan17/Xiomi-14t-pro
# rothko-engine 6974dd4 (2026-10-17): Cogan d9cbc9f + ENGINE.md; same engine as the
# green runs 38934173981 (attempt 2) and 38970833229.
ENGINE_COMMIT=6974dd4a091b39d1d2d71ef7b35df1a5f60e3220
