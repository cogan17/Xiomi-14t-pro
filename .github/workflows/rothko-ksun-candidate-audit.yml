          header = Path("/tmp/ksun/kernel/feature/sulog.h").read_text()
          pinned_core = Path("/tmp/ksun/kernel/core/init.c").read_text()
          gate = (
              "if (atomic_cmpxchg(&sulog_init_attempted, 0, 1) != 0)\n"
