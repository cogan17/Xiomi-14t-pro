          name = "static int escape_with_root_profile_common(bool require_su_profile)"
          guard = (
              "if (require_su_profile &&\n"
              "        (cred->uid.val != profile->uid ||\n"
              "         cred->euid.val != profile->uid ||\n"
              "         cred->gid.val != profile->gid ||\n"
              "         cred->egid.val != profile->gid)) {\n"
              "        ret = -EACCES;\n"
              "        goto out_abort_creds;\n"
              "    }"
          )
          def accepts_contract(code):
              if code.count(name) != 1:
                  return False
              try:
                  body = code.split(name, 1)[1].split("int escape_with_root_profile(void)", 1)[0]
                  if body.count("commit_creds(cred);") != 1:
                      return False
                  before, after = body.split("commit_creds(cred);", 1)
              except (IndexError, ValueError):
                  return False
              selinux_call = "ret = setup_selinux(profile->selinux_domain, cred);"
              selinux_check = "if (ret)\n        goto out_abort_creds;"
              return (
                  before.count(guard) == 1
                  and before.find(selinux_call) >= 0
                  and before.find(selinux_call) < before.find(selinux_check, before.find(selinux_call)) < before.find(guard)
                  and "out_abort_creds:" in after
                  and "abort_creds(cred);" in after
                  and "return escape_with_root_profile_common(false);" in code
                  and "return escape_with_root_profile_common(true);" in code
              )
