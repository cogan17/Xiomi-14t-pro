          print("BLOCK: no SU_SESSION FD ownership, runtime, compile or KMI authorization")
          PY
          echo "BLOCK: source-only compatibility refinement; not an SU_SESSION implementation"

      - name: Verify precommit session eligibility without granting FD (source only)
