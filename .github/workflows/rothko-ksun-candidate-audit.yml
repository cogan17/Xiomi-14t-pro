                  "ksu_sulog_enabled = false;", 1).replace(
                  "    ret = ksu_register_feature_handler(&sulog_handler);",
                  "    ret = ksu_register_feature_handler(&sulog_handler);\n    " + gate, 1)),
              ("remove sticky attempted state", source.replace(
