name: Rothko KSUN independent candidate audit
on:
  push:
    branches:
      - feat/rothko-ksun-susfs-compat-audit
    paths:
      - patches/rothko-ksun-sucompat-fail-closed-candidate.patch
      - patches/rothko-ksun-sucompat-session-intent-candidate.patch
      - patches/rothko-ksun-groups-fail-closed-candidate.patch
      - patches/rothko-ksun-seccomp-prealloc-candidate.patch
      - patches/rothko-ksun-selinux-fail-closed-candidate.patch
      - .github/workflows/rothko-ksun-candidate-audit.yml
      - scripts/rothko_ksun_security_contract.py
      - tests/test_rothko_ksun_security_contract.py
      - scripts/rothko_ksun_ioctl_matrix.py
      - tests/test_rothko_ksun_ioctl_matrix.py
      - scripts/rothko_ksun_shared_cred_audit.py
      - tests/test_rothko_ksun_shared_cred_audit.py
      - patches/rothko-ksun-shared-cred-status-candidate.patch
      - scripts/rothko_ksun_shared_cred_candidate_audit.py
      - tests/test_rothko_ksun_shared_cred_candidate.py
      - patches/rothko-ksun-shared-cred-stage-guard-candidate.patch
      - scripts/rothko_ksun_stage_guard_candidate_audit.py
      - tests/test_rothko_ksun_stage_guard_candidate.py
      - scripts/rothko_ksun_g2_g4_risk_audit.py
      - tests/test_rothko_ksun_g2_g4_risk_audit.py
  pull_request:
    paths:
      - patches/rothko-ksun-sucompat-fail-closed-candidate.patch
      - patches/rothko-ksun-sucompat-session-intent-candidate.patch
      - patches/rothko-ksun-groups-fail-closed-candidate.patch
      - patches/rothko-ksun-seccomp-prealloc-candidate.patch
      - patches/rothko-ksun-selinux-fail-closed-candidate.patch
      - .github/workflows/rothko-ksun-candidate-audit.yml
      - scripts/rothko_ksun_security_contract.py
      - tests/test_rothko_ksun_security_contract.py
      - scripts/rothko_ksun_ioctl_matrix.py
      - tests/test_rothko_ksun_ioctl_matrix.py
      - scripts/rothko_ksun_shared_cred_audit.py
      - tests/test_rothko_ksun_shared_cred_audit.py
      - patches/rothko-ksun-shared-cred-status-candidate.patch
      - scripts/rothko_ksun_shared_cred_candidate_audit.py
      - tests/test_rothko_ksun_shared_cred_candidate.py
      - patches/rothko-ksun-shared-cred-stage-guard-candidate.patch
      - scripts/rothko_ksun_stage_guard_candidate_audit.py
      - tests/test_rothko_ksun_stage_guard_candidate.py
      - scripts/rothko_ksun_g2_g4_risk_audit.py
      - tests/test_rothko_ksun_g2_g4_risk_audit.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitlab_probe:
    name: GitLab SUSFS read-only connectivity (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    steps:
      - name: Verify pinned SUSFS GitLab fetch without modifying kernel
        shell: bash
        run: |
          set -Eeuo pipefail
          getent ahostsv4 gitlab.com
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 --output /dev/null https://gitlab.com/simonpunk/susfs4ksu
          pin=5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          git init -q /tmp/susfs-connectivity
          git -C /tmp/susfs-connectivity remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          timeout 90 git -C /tmp/susfs-connectivity -c http.version=HTTP/1.1 fetch --quiet --depth=1 origin "$pin"
          test "$(git -C /tmp/susfs-connectivity rev-parse FETCH_HEAD)" = "$pin"
          echo "PASS: pinned SUSFS GitLab source reachable from GitHub Actions"
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable KSUN candidate without GitLab
        shell: bash
        run: |
          set -Eeuo pipefail
          pin=3438d6aa431f96a23f9e625bec3d53ce1fb14161
          git init -q /tmp/ksun
          git -C /tmp/ksun remote add origin https://github.com/pershoot/KernelSU-Next.git
          git -C /tmp/ksun -c http.version=HTTP/1.1 fetch --quiet --depth=1 origin "$pin"
          git -C /tmp/ksun checkout --quiet --detach FETCH_HEAD
          test "$(git -C /tmp/ksun rev-parse HEAD)" = "$pin"
          # Check and apply sequentially: both candidates touch app_profile.c.
          # Independent checks against pristine source miss cross-patch overlap.
          git -C /tmp/ksun apply --check --verbose "$GITHUB_WORKSPACE/patches/rothko-ksun-groups-fail-closed-candidate.patch"
          git -C /tmp/ksun apply "$GITHUB_WORKSPACE/patches/rothko-ksun-groups-fail-closed-candidate.patch"
          git -C /tmp/ksun apply --check --verbose "$GITHUB_WORKSPACE/patches/rothko-ksun-sucompat-fail-closed-candidate.patch"
          git -C /tmp/ksun apply "$GITHUB_WORKSPACE/patches/rothko-ksun-sucompat-fail-closed-candidate.patch"
          # Source-only additive candidate, not an integrated SUSFS hook or root FD.
          git -C /tmp/ksun apply --check --verbose "$GITHUB_WORKSPACE/patches/rothko-ksun-sucompat-session-intent-candidate.patch"
          git -C /tmp/ksun apply "$GITHUB_WORKSPACE/patches/rothko-ksun-sucompat-session-intent-candidate.patch"
          git -C /tmp/ksun apply --reverse --check "$GITHUB_WORKSPACE/patches/rothko-ksun-sucompat-session-intent-candidate.patch"
          python3 - <<'PY'
          from pathlib import Path
          su = Path("/tmp/ksun/kernel/feature/sucompat.c").read_text()
          pre = su.split("int ksu_handle_execveat_sucompat(int *fd", 1)[1].split("extern struct static_key_true is_first_zygote;", 1)[0]
          wrapper = su.split("int ksu_handle_execveat(int *fd", 1)[1].split("#endif", 1)[0]
          import re
          # Return counts alone are insufficient: a denied branch and the success
          # branch could be swapped while counts remain unchanged. Scope each
          # expected return to its own immutable source control-flow interval.
          def require_one_return(source, begin, end, expected):
              assert source.count(begin) == 1, f"missing/ambiguous return branch: {begin}"
              region = source.split(begin, 1)[1]
              assert region.count(end) >= 1, f"missing branch boundary: {end}"
              region = region.split(end, 1)[0]
              actual = re.findall(r"\breturn\s+([01]);", region)
              assert actual == [str(expected)], f"unsafe return in {begin}: {actual} != {[str(expected)]}"
          denied = (
              ("if (unlikely(!filename_ptr))", "filename = *filename_ptr;"),
              ("if (IS_ERR(filename))", "if (!ksu_handle_execveat_init("),
              ("if (!ksu_handle_execveat_init(", "if (likely(memcmp("),
              ("if (likely(memcmp(", "if (current_chrooted())"),
              ("if (current_chrooted())", "if (!ksu_is_allow_uid_for_current("),
              ("if (!ksu_is_allow_uid_for_current(", "ksu_compat_sulog('x');"),
              ("if (IS_ERR(replacement))", "ret = escape_with_root_profile();"),
              ("if (ret) {", "/* A zero return may be an early no-op"),
              ("if (!uid_eq(current_euid(), GLOBAL_ROOT_UID)", "/* Transfer the allocated filename"),
          )
          for begin, end in denied:
              require_one_return(pre, begin, end, 1)
          wrapper_denied = (
              ("if (unlikely(!filename_ptr))", "if (IS_ERR(*filename_ptr))"),
              ("if (IS_ERR(*filename_ptr))", "if (current_euid().val == 0)"),
              ("if (ksu_handle_execveat_ksud(fd, filename_ptr, argv, envp, flags))", "return ksu_handle_execveat_sucompat("),
          )
          for begin, end in wrapper_denied:
              require_one_return(wrapper, begin, end, 1)
          success = pre.split("/* Transfer the allocated filename only after authorization. */", 1)
          assert len(success) == 2 and success[1].count("return 0;") == 1
          assert success[1].count("return 1;") == 0
          assert success[1].find("*filename_ptr = replacement;") < success[1].find("return 0;")
          assert "susfs_is_current_ksu_domain()" in pre
          assert len(re.findall(r"\breturn\s+1;", pre)) == 9
          assert len(re.findall(r"\breturn\s+1;", wrapper)) == 3
          print("PASS: 12 scoped non-SU/denied returns are nonzero; only authenticated redirect returns zero")
          print("BLOCK: post-exec session FD lifecycle, credential readiness and release unverified")
          PY
          git -C /tmp/ksun apply --check --verbose "$GITHUB_WORKSPACE/patches/rothko-ksun-seccomp-prealloc-candidate.patch"
          git -C /tmp/ksun apply "$GITHUB_WORKSPACE/patches/rothko-ksun-seccomp-prealloc-candidate.patch"
          git -C /tmp/ksun apply --check --verbose "$GITHUB_WORKSPACE/patches/rothko-ksun-selinux-fail-closed-candidate.patch"
          git -C /tmp/ksun apply "$GITHUB_WORKSPACE/patches/rothko-ksun-selinux-fail-closed-candidate.patch"
          echo "PASS: four candidates apply sequentially to pinned KSUN source"
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/ksun/kernel")
          su = (root / "feature/sucompat.c").read_text()
          policy = (root / "policy/app_profile.c").read_text()
          selinux = (root / "selinux/selinux.c").read_text()
          selinux_h = (root / "selinux/selinux.h").read_text()
          checks = {
              "no in-place filename overwrite": "memcpy((void *)filename->name, ksud_path" not in su,
              "allocated filename before profile escape": su.find("replacement = getname_kernel(ksud_path)") < su.find("ret = escape_with_root_profile()"),
              "post-escape root/domain check": "susfs_is_current_ksu_domain()" in su and "current_euid()" in su,
              "profile commit exists": "commit_creds(cred)" in policy,
              "SELinux helper returns status": "int setup_selinux(const char *, struct cred *);" in selinux_h and "return ret;" in selinux.split("int setup_selinux(",1)[1].split("void setup_ksu_cred(",1)[0],
              "root profile aborts on SELinux failure": "ret = setup_selinux(profile->selinux_domain, cred);\n    if (ret)\n        goto out_abort_creds;" in policy,
              "init root aborts on SELinux failure": "if (setup_selinux(KERNEL_SU_CONTEXT, cred)) {\n        abort_creds(cred);" in policy,
              "seccomp scratch reserved before commit": policy.index("seccomp_scratch = kmalloc(") < policy.index("commit_creds(cred);", policy.index("int escape_with_root_profile(void)")),
              "post-commit seccomp uses reserved scratch": "disable_seccomp_with_scratch(seccomp_scratch);" in policy,
              "seccomp scratch allocation returns ENOMEM": "if (!seccomp_scratch)\n            return -ENOMEM;" in policy,
              "prepared creds failure frees scratch": 'pr_warn("prepare_creds failed!' in policy and "kfree(seccomp_scratch);\n        return -ENOMEM;" in policy,
              "abort path frees seccomp scratch": "abort_creds(cred);\n    kfree(seccomp_scratch);" in policy,
              "success path frees seccomp scratch": "disable_seccomp_with_scratch(seccomp_scratch);\n    kfree(seccomp_scratch);" in policy,
              "scratch seccomp helper contains no allocation": "kmalloc(" not in policy.split("static void disable_seccomp_with_scratch(", 1)[1].split("void disable_seccomp(void)", 1)[0],

              "groups setup failure checked before commit": policy.index("ret = setup_groups(profile, cred);") < policy.index("commit_creds(cred);", policy.index("int escape_with_root_profile(void)")) and "if (ret)\n        goto out_abort_creds;" in policy,
              "namespace setup follows commit in escape function": policy.index("commit_creds(cred);", policy.index("int escape_with_root_profile(void)")) < policy.index("setup_mount_ns(profile->namespaces);", policy.index("int escape_with_root_profile(void)")),
          }
          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + label, flush=True)
          if not all(checks.values()):
              raise SystemExit("Source-level candidate invariant failure")
          # These are unresolved source hazards, not CI pass criteria.
          escape = policy.split("int escape_with_root_profile(void)", 1)[1].split("int escape_to_root_for_init(void)", 1)[0]
          groups = policy.split("static int setup_groups(", 1)[1].split("void seccomp_filter_release(", 1)[0]
          if "groups_alloc(" in groups and "return;" in groups:
              print("BLOCK: setup_groups can silently return on allocation/validation failure")
          print("BLOCK: seccomp scratch candidate still needs Rothko BSP compile and runtime review")
          # Explicit release gate: source-level audits must never claim authorization.
          precommit = escape.split("commit_creds(cred);", 1)[0]
          if "ret = setup_selinux(profile->selinux_domain, cred);" not in precommit:
              raise SystemExit("FAIL: SELinux profile setup must precede credential commit")
          if "ksu_get_root_profile(cred->uid.val)" not in precommit:
              raise SystemExit("FAIL: root profile lookup must precede credential commit")
          print("PASS: SELinux profile setup and profile lookup precede commit (ordering only)")
          print("BLOCK: profile lookup alone is not an authorization decision")
          print("BLOCK: SELinux error propagation is source-only; actual BSP behavior not proven")
          print("BLOCK: no verified pre-commit domain authorization guarantee")
          print("PASS: textual ordering within escape_with_root_profile (not runtime proof)")
          print("BLOCK: no credential rollback after commit_creds")
          print("BLOCK: post-exec session FD lifecycle absent")
          PY
          echo "BLOCK: credential authorization before commit_creds not demonstrated"
          echo "BLOCK: authenticated post-exec session FD not implemented"
          echo "This job validates patch applicability ONLY; it is not release approval."
      - name: Verify KSUN authorization and FD source contracts (no release)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/rothko_ksun_security_contract.py" "/tmp/ksun/kernel"
      - name: Mutation regression tests (expect security checks to reject unsafe changes)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/tests/test_rothko_ksun_security_contract.py" "/tmp/ksun/kernel" "$GITHUB_WORKSPACE/scripts/rothko_ksun_security_contract.py"
      - name: Verify complete pinned ioctl permission matrix (no release)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/rothko_ksun_ioctl_matrix.py" "/tmp/ksun/kernel"
      - name: Negative ioctl permission mutation tests (12 regressions)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/tests/test_rothko_ksun_ioctl_matrix.py" "/tmp/ksun/kernel" "$GITHUB_WORKSPACE/scripts/rothko_ksun_ioctl_matrix.py"
      - name: Inspect shared KSUN credentials across init and module rc (source only)
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/rothko_ksun_shared_cred_audit.py" "/tmp/ksun/kernel"
      - name: Reject incomplete shared-credential contract and 16 unsafe mutations
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/tests/test_rothko_ksun_shared_cred_audit.py" "/tmp/ksun/kernel" "$GITHUB_WORKSPACE/scripts/rothko_ksun_shared_cred_audit.py"
      - name: Verify isolated G1 helper candidate applicability (no kernel build)
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/patches/rothko-ksun-shared-cred-status-candidate.patch"
          git -C /tmp/ksun apply --check --verbose "$patch"
          git -C /tmp/ksun apply "$patch"
          git -C /tmp/ksun apply --reverse --check "$patch"
          git -C /tmp/ksun diff --check
          python3 "$GITHUB_WORKSPACE/scripts/rothko_ksun_shared_cred_candidate_audit.py" "/tmp/ksun/kernel"
          python3 "$GITHUB_WORKSPACE/tests/test_rothko_ksun_shared_cred_candidate.py" "/tmp/ksun/kernel" "$GITHUB_WORKSPACE/scripts/rothko_ksun_shared_cred_candidate_audit.py"
          echo "BLOCK: fifth G1 patch is a source-only candidate; caller/FD/ABI/release gates remain denied"
      - name: Verify isolated G3 startup caller guards (not a safe retry policy)
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/patches/rothko-ksun-shared-cred-stage-guard-candidate.patch"
          git -C /tmp/ksun apply --check --verbose "$patch"
          git -C /tmp/ksun apply "$patch"
          git -C /tmp/ksun apply --reverse --check "$patch"
          git -C /tmp/ksun diff --check
          python3 "$GITHUB_WORKSPACE/scripts/rothko_ksun_stage_guard_candidate_audit.py" "/tmp/ksun/kernel"
          python3 "$GITHUB_WORKSPACE/tests/test_rothko_ksun_stage_guard_candidate.py" "/tmp/ksun/kernel" "$GITHUB_WORKSPACE/scripts/rothko_ksun_stage_guard_candidate_audit.py"
          echo "BLOCK: G3 check ordering is source-only; retries, cleanup, FD, KMI and release unverified"
      - name: Map G2 late-load unwind and G4 module rc credential hazards
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/rothko_ksun_g2_g4_risk_audit.py" "/tmp/ksun/kernel"
      - name: Reject 21 G2 G4 risk inventory mutations and keep remediation denied
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/tests/test_rothko_ksun_g2_g4_risk_audit.py" "/tmp/ksun/kernel" "$GITHUB_WORKSPACE/scripts/rothko_ksun_g2_g4_risk_audit.py"
