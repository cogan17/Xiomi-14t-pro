          session_guard = (
              "if (profile->uid != 0 ||\n"
              "            strcmp(profile->selinux_domain, KERNEL_SU_CONTEXT) != 0 ||\n"
              "            !is_task_ksu_domain(cred)) {\n"
              "            ret = -EOPNOTSUPP;\n"
              "            goto out_abort_creds;\n"
              "        }"
          )
          def profile_session_precommit_safe(source):
              try:
                  body = source.split("static int escape_with_root_profile_common(bool require_su_profile)", 1)[1].split(
                      "int escape_with_root_profile(void)", 1)[0]
                  assert body.count("commit_creds(cred);") == 1
                  before, after = body.split("commit_creds(cred);", 1)
              except (IndexError, AssertionError, ValueError):
                  return False
              return (
                  before.count(session_guard) == 1
                  and before.count("if (require_su_profile) {") == 1
                  and before.find("ret = setup_selinux(profile->selinux_domain, cred);") >= 0
                  and before.find("ret = setup_selinux(profile->selinux_domain, cred);") < before.find(session_guard)
                  and "out_abort_creds:" in after
                  and "abort_creds(cred);" in after
