          assert "ret = escape_with_root_profile_for_su();" in su
          # Real FD authorization is deliberately NOT claimed by this guard.
          assert "susfs_is_current_ksu_domain()" in su
          negative = [
              ("omit UID comparison", profile.replace("cred->euid.val != profile->uid", "false", 1)),
              ("omit GID comparison", profile.replace("cred->egid.val != profile->gid", "false", 1)),
              ("always skip requirement", profile.replace("if (require_su_profile &&", "if (false &&", 1)),
              ("allow failed transition", profile.replace("ret = setup_selinux(profile->selinux_domain, cred);\n    if (ret)\n        goto out_abort_creds;",
                  "ret = setup_selinux(profile->selinux_domain, cred);\n    if (ret)\n        ret = 0;", 1)),
              ("move guard after commit", profile.replace(guard, "", 1).replace(
                  "    commit_creds(cred);", "    commit_creds(cred);\n    " + guard, 1)),
              ("change generic root callers", profile.replace(
                  "return escape_with_root_profile_common(false);",
                  "return escape_with_root_profile_common(true);", 1)),
          ]
          for label, broken in negative:
              assert broken != profile, label + ": mutation fixture did not change source"
              assert not accepts_contract(broken), label + ": unsafe mutation not detected"
              print("PASS: reject unsafe source mutation — " + label)
          # Host-only behavior matrix; does not execute kernel C or issue privileges.
          def prepared_matches_profile(profile_uid, profile_gid, effective_uid, effective_gid, selinux_ok):
              return selinux_ok and profile_uid == effective_uid and profile_gid == effective_gid
          cases = [
              ("default KSU profile", 0, 0, 0, 0, True, True),
              ("authorized custom UID", 2000, 2000, 2000, 2000, True, True),
              ("authorized custom SELinux domain", 0, 0, 0, 0, True, True),
              ("prepared UID mismatch", 2000, 2000, 0, 2000, True, False),
              ("prepared GID mismatch", 2000, 2000, 2000, 0, True, False),
              ("SELinux transition failure", 0, 0, 0, 0, False, False),
