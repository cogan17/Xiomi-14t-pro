name: Cogan Rothko - Root and Feature Selection (Development)

# Only plan configuration. NO source patches, compilation, root installation or flashable ZIP.
on:
  workflow_dispatch:
    inputs:
      root_flavor:
        description: 'Root flavor; All means three separate variants'
        type: choice
        required: true
        default: 'BakaSU'
        options:
          - 'KernelSU'
          - 'KernelSU-Next'
          - 'BakaSU'
          - 'All (KSU + KSUN + BakaSU)'
      susfs:
        description: 'SUSFS (planning only)'
        type: boolean
        required: true
        default: true
      nomount:
        description: 'NoMount (planning only)'
        type: boolean
        required: true
        default: true
      baseband_guard:
        description: 'Baseband Guard (planning only)'
        type: boolean
        required: true
        default: true
      networking:
        description: 'Networking (planning only)'
        type: boolean
        required: true
        default: true
      ptrace_patch:
        description: 'Ptrace Patch (planning only)'
        type: boolean
        required: true
        default: true
      unicode_fix:
        description: 'Unicode Fix (planning only)'
        type: boolean
        required: true
        default: true
      bpf_stack:
        description: 'BPF Stack (BTF + eBPF + FUSE-BPF) (planning only)'
        type: boolean
        required: true
        default: true
      performance:
        description: 'Performance (planning only)'
        type: boolean
        required: true
        default: false
      release_notes_preview:
        description: 'Render release notes preview only (planning only)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Validate requested variants (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      root_matrix: ${{ steps.plan.outputs.root_matrix }}
      features_json: ${{ steps.plan.outputs.features_json }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Rothko selections and generate summary
        id: plan
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
          SUSFS: ${{ inputs.susfs }}
          NOMOUNT: ${{ inputs.nomount }}
          BASEBAND_GUARD: ${{ inputs.baseband_guard }}
          NETWORKING: ${{ inputs.networking }}
          PTRACE_PATCH: ${{ inputs.ptrace_patch }}
          UNICODE_FIX: ${{ inputs.unicode_fix }}
          BPF_STACK: ${{ inputs.bpf_stack }}
          PERFORMANCE: ${{ inputs.performance }}
          RELEASE_NOTES_PREVIEW: ${{ inputs.release_notes_preview }}
        run: python3 scripts/rothko_feature_plan.py

  preview-variant:
    name: Preview ${{ matrix.root }} (no build)
    needs: plan
    if: ${{ !inputs.release_notes_preview }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.plan.outputs.root_matrix) }}
    env:
      ROOT_VARIANT: ${{ matrix.root }}
      FEATURES_JSON: ${{ needs.plan.outputs.features_json }}
    steps:
      - name: Show feature selection without building
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('### Planned independent root: ' + os.environ['ROOT_VARIANT'] + '\n\n')
              out.write('| Feature | Requested |\n|---|---|\n')
              for key, enabled in json.loads(os.environ['FEATURES_JSON']).items():
                  if key != 'release_notes_preview':
                      out.write(f'| {key} | {str(enabled).lower()} |\n')
              out.write('\n**NO BUILD, PATCH, ARTIFACT OR FLASH.**\n')
          PY
