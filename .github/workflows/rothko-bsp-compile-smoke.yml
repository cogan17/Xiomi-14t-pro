name: Cogan Rothko - Manual Baseline Configure / Compile (No Artifacts)

# Manual diagnostic only: config generation by default, opt-in ARM64 Image compile.
# Generic GKI config is NOT Rothko board configuration. No artifact or flashing.
on:
  # Manual only. Never compile because a PR changed this workflow.
  workflow_dispatch:
    inputs:
      stage:
        description: 'Diagnostic stage (no downloadable kernel artifact)'
        type: choice
        options:
          - config
          - image
        default: config
        required: true
      confirm_image:
        description: 'For image stage only, type DIAGNOSTIC (not flash-ready)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: rothko-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-arm64:
    name: Configure or compile ARM64 baseline (NOT FLASHABLE)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ARCH: arm64
      LLVM: '1'
      LLVM_IAS: '1'
      KBUILD_BUILD_USER: Cogan-CI
      KBUILD_BUILD_HOST: github
    steps:
      - name: Checkout full kernel source on Linux
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard manual baseline diagnostics
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          STAGE: ${{ inputs.stage }}
          CONFIRM_IMAGE: ${{ inputs.confirm_image }}
        run: |
          set -euo pipefail
          [[ "$EVENT" == workflow_dispatch ]] || { echo '::error::Manual invocation only'; exit 1; }
          [[ "$BRANCH" == dev/rothko ]] || { echo '::error::Run only on dev/rothko'; exit 1; }
          [[ "$STAGE" == config || "$STAGE" == image ]] || { echo '::error::Unsupported diagnostic stage'; exit 1; }
          if [[ "$STAGE" == image && "$CONFIRM_IMAGE" != DIAGNOSTIC ]]; then
            echo '::error::For image stage type DIAGNOSTIC; never flash generated Image'
            exit 1
          fi
          echo "Diagnostic stage: $STAGE (no upload/artifact/release)"

      - name: Install host LLVM compiler and basic kernel dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang lld llvm bc bison flex libssl-dev libelf-dev dwarves cpio rsync python3
          clang --version | head -n 1
          ld.lld --version
          llvm-ar --version | head -n 1

      - name: Check source provenance and MTK vendor branch
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/rothko_bsp_compile_smoke.sh provenance
          remote_sha="$(git ls-remote --exit-code https://github.com/MiCode/MTK_kernel_modules.git refs/heads/bsp-rothko-u-oss | cut -f1)"
          expected_vendor_sha=a875701d71d29cfac0a9456c1e9c223d44f53d68
          [[ "$remote_sha" == "$expected_vendor_sha" ]] || {
            echo "::error::Official MTK module branch changed ($remote_sha), review source pairing before compiling"
            exit 1
          }
          {
            echo '### Rothko BSP compilation (diagnostic only)'
            echo
            echo "- Source checkout SHA: $(git rev-parse HEAD)"
            echo "- MiCode MTK kernel modules branch: bsp-rothko-u-oss @ $remote_sha"
            echo '- Vendor modules were NOT built or integrated.'
            echo '- Host compiler is NOT the pinned Android production toolchain.'
            echo '- Generic gki_defconfig is NOT verified for Rothko mt6989.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate common GKI ARM64 config (default stage)
        shell: bash
        run: bash scripts/rothko_bsp_compile_smoke.sh config

      - name: Run opt-in diagnostic ARM64 Image compilation
        if: ${{ inputs.stage == 'image' }}
        shell: bash
        run: bash scripts/rothko_bsp_compile_smoke.sh compile

      - name: Record checksum only for explicit Image stage (no binary published)
        if: ${{ inputs.stage == 'image' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib
          p = pathlib.Path('out/arch/arm64/boot/Image')
          assert p.is_file() and p.stat().st_size > 1048576
          h = hashlib.sha256()
          with p.open('rb') as src:
              for block in iter(lambda: src.read(1048576), b''): h.update(block)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n**Compiled ARM64 kernel Image (NOT FLASHABLE)**\n\n')
              out.write(f'- Image size: {p.stat().st_size} bytes\n')
              out.write(f'- Image SHA-256: {h.hexdigest()}\n')
              out.write('- No AK3 ZIP, boot.img, artifact upload, release, or flash approval.\n')
              out.write('- Root drivers, SUSFS, NoMount, vendor ABI/KMI NOT validated.\n')
          PY
