name: Rothko SUSFS source audit (read-only)
on:
  pull_request:
    paths:
      - .github/workflows/rothko-susfs-source-audit.yml
  push:
    branches:
      - feat/rothko-ksun-susfs-compat-audit
    paths:
      - scripts/rothko_susfs_source_probe.sh
      - .github/workflows/rothko-susfs-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    # Read-only provenance audit resumed after exact pinned GitLab fetch succeeded.
    # This is not permission to build, integrate, release, or flash.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit script only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/rothko_susfs_source_probe.sh
            patches/rothko-ksun-sucompat-fail-closed-candidate.patch
      - name: Validate audit shell syntax
        shell: bash
        run: bash -n scripts/rothko_susfs_source_probe.sh
      - name: Acquire upstream and check compatibility gates
        shell: bash
        run: bash scripts/rothko_susfs_source_probe.sh

  gitlab-transport:
    # Upstream GitLab is intermittent (#11): no automatic retries on PR/push.
    # Explicit manual source-only dispatch can retry once when appropriate.
    # Do NOT unblock full SUSFS audit or initiate a build.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch Simonpunk SUSFS exact pinned commit from official GitLab
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_TERMINAL_PROMPT=0
          pin=5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          expected_tree=b39cd4117178ce73d2973f7bcdae5c74defc8f68
          upstream=https://gitlab.com/simonpunk/susfs4ksu.git
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          if ! timeout 105 git -C "$tmp" -c http.version=HTTP/1.1 fetch --depth=1 "$upstream" "$pin"; then
            echo "::error::Official GitLab exact-SHA transport did not succeed from GitHub runner"
            echo "BLOCK: this does not by itself establish a GitLab.com-wide outage"
            exit 1
          fi
          git -C "$tmp" checkout --quiet --detach FETCH_HEAD
          actual_sha="$(git -C "$tmp" rev-parse HEAD)"
          actual_tree="$(git -C "$tmp" rev-parse 'HEAD^{tree}')"
          [[ "$actual_sha" == "$pin" ]] || { echo "::error::Pinned commit mismatch"; exit 1; }
          [[ "$actual_tree" == "$expected_tree" ]] || { echo "::error::Pinned tree mismatch"; exit 1; }
          for source in \
            kernel_patches/50_add_susfs_in_gki-android14-6.1.patch \
            kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            kernel_patches/include/linux/susfs_def.h; do
            test -s "$tmp/$source" || { echo "::error::Missing pinned upstream source: $source"; exit 1; }
            sha256sum "$tmp/$source"
          done
          echo "===== OFFICIAL SUSFS EXECVE SEMANTICS (PINNED) ====="
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          companion=(root/"kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch").read_text(errors="replace").splitlines()
          kernel=(root/"kernel_patches/50_add_susfs_in_gki-android14-6.1.patch").read_text(errors="replace").splitlines()
          def sections(lines):
              found=[]
              for line in lines:
                  if line.startswith("diff --git "):
                      found.append([])
                  if found:
                      found[-1].append(line)
              return found
          for label, lines, token, limit in [
              ("KSUN companion POST EXEC",companion,"ksu_handle_post_execveat_sucompat",170),
              ("KSUN companion REBOOT/FD",companion,"ksu_install_fd",100),
              ("KERNEL fs/exec.c",kernel,"diff --git a/fs/exec.c",150),
              ("KERNEL fs/namei.c",kernel,"diff --git a/fs/namei.c",110),
          ]:
              matching=[s for s in sections(lines) if any(token in x for x in s)]
              print("=== "+label+": matches="+str(len(matching))+" ===",flush=True)
              for s in matching[:3]:
                  print("FILE",s[0],flush=True)
                  if token.startswith("diff --git"):
                      show=s[:limit]
                  else:
                      keep={0}
                      for i,x in enumerate(s):
                          if token in x:
                              keep.update(range(max(0,i-18),min(len(s),i+37)))
                      show=[f"{i+1}: {s[i]}" for i in sorted(keep)[:limit]]
                  for line in show:
                      print(line,flush=True)
                  if len(s)>len(show):print("... section truncated (evidence only)",flush=True)
          print("END OFFICIAL SUSFS PATCH EXCERPTS — NO SOURCE MODIFICATION",flush=True)
          PY
          {
            echo "### Simonpunk GitLab pinned-source availability"
            echo
            echo "- Exact pinned SUSFS SHA: $actual_sha"
            echo "- Exact verified Git tree: $actual_tree"
            echo "- Official GitLab fetch: successful from GitHub runner"
            echo "- Source NOT patched, built, integrated, uploaded or flashed."
            echo "- KSUN/SUSFS compatibility and PR #9 release: STILL BLOCKED."
          } >> "$GITHUB_STEP_SUMMARY"
