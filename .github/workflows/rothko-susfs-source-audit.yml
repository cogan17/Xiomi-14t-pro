name: Rothko SUSFS source audit (read-only)
on:
  pull_request:
    paths:
      - .github/workflows/rothko-susfs-source-audit.yml
      - scripts/rothko_susfs_source_probe.sh
      - docs/rothko-susfs-porting-conflicts.md
  push:
    branches:
      - feat/rothko-ksun-susfs-compat-audit
    paths:
      - scripts/rothko_susfs_source_probe.sh
      - .github/workflows/rothko-susfs-source-audit.yml
      - docs/rothko-susfs-porting-conflicts.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    # Read-only provenance audit resumed after exact pinned GitLab fetch succeeded.
    # This is not permission to build, integrate, release, or flash.
    # Save CI minutes: cancel only obsolete revisions of this failing release gate.
    # Latest commit still MUST execute this job; its failure is never suppressed.
    concurrency:
      group: rothko-provenance-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit script only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/rothko_susfs_source_probe.sh
            patches/rothko-ksun-sucompat-fail-closed-candidate.patch
      - name: Validate audit shell syntax
        shell: bash
        run: bash -n scripts/rothko_susfs_source_probe.sh
      - name: Acquire upstream and check compatibility gates
        shell: bash
        run: bash scripts/rothko_susfs_source_probe.sh

  context-drift:
    name: Classify SUSFS include-context drift (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch pinned upstream and inspect rejected include hunks
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_TERMINAL_PROMPT=0
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init -q "$tmp/susfs"
          git -C "$tmp/susfs" remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          pin=5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          timeout 105 git -C "$tmp/susfs" -c http.version=HTTP/1.1 fetch --quiet --depth=1 origin "$pin"
          git -C "$tmp/susfs" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$tmp/susfs" rev-parse HEAD)" = "$pin"
          test "$(git -C "$tmp/susfs" rev-parse 'HEAD^{tree}')" = b39cd4117178ce73d2973f7bcdae5c74defc8f68
          git clone --quiet --depth=1 --single-branch --branch feat/rothko-ksun-susfs-compat-audit https://github.com/cogan17/Xiomi-14t-pro.git "$tmp/rothko"
          echo "===== PINNED SUSFS HEADER PROVENANCE ====="
          test -f "$tmp/susfs/kernel_patches/include/linux/susfs_def.h" || {
            echo "NOTE: header is not at conventional kernel_patches/include/linux/susfs_def.h; inspect pinned tree layout"
          }
          git -C "$tmp/susfs" ls-tree -r --name-only HEAD | grep -E '(^|/)susfs_def[.]h$|(^|/)susfs[.]h$' || true
          echo "===== PATCH HEADER DECLARATIONS ====="
          grep -n -F 'susfs_def.h' "$tmp/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" | head -25 || true
          python3 - "$tmp/susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch" "$tmp/rothko" <<'PY'
          from pathlib import Path
          import re,sys
          patch=Path(sys.argv[1]).read_text(errors="replace").splitlines()
          root=Path(sys.argv[2])
          targets={"fs/proc/base.c","fs/proc/task_mmu.c","mm/memory.c","fs/exec.c","fs/namei.c"}
          chunks={}
          file=None
          for line in patch:
              if line.startswith("diff --git a/"):
                  file=line.split()[2][2:]
                  if file in targets: chunks.setdefault(file,[])
              elif file in targets and line.startswith("@@ "):
                  chunks[file].append([line])
              elif file in targets and chunks.get(file):
                  chunks[file][-1].append(line)
          lines=["# SUSFS pinned patch: context drift classification","","Evidence only. No patch applied, no source modified.",""]
          for file in sorted(targets):
              src=(root/file).read_text(errors="replace").splitlines() if (root/file).is_file() else []
              lines.append("## "+file)
              for hunk in chunks.get(file,[]):
                  # Stop before the next file header; exclude diff metadata.
                  body=[]
                  for x in hunk[1:]:
                      if x.startswith(("diff --git ", "index ", "--- ", "+++ ", "@@ ")):
                          break
                      if x.startswith((" ", "+", "-")):
                          body.append(x)
                  added=[x[1:] for x in body if x.startswith("+")]
                  removed=[x[1:] for x in body if x.startswith("-")]
                  context=[x[1:] for x in body if x.startswith(" ")]
                  include_only=bool(added or removed) and all(x.strip().startswith("#include ") or not x.strip() for x in added+removed)
                  # A header hunk may add blank lines or conditional guards.
                  # Report additions individually rather than claiming the entire hunk is include-only.
                  include_additions=[x.strip() for x in added if x.strip().startswith("#include ")]
                  other_additions=[x.strip() for x in added if x.strip() and not x.strip().startswith("#include ")]
                  # Classify additive include hunks separately from source behavior.
                  # Do not treat an include-only hunk as an approved port.
                  additive_include_only=bool(added) and not removed and all(
                      x.strip().startswith("#include ") or not x.strip() for x in added
                  )
                  anchors=[x for x in context if x.strip() and not x.strip().startswith("#include ")]
                  matched=sum(1 for x in anchors if x in src)
                  added_includes=[x.strip() for x in added if x.strip().startswith("#include ")]
                  existing=sum(1 for x in added_includes if x in [y.strip() for y in src])
                  kind="ADDITIVE_INCLUDE_ONLY" if additive_include_only else ("INCLUDE_ONLY_CHANGE" if include_only else "SEMANTIC_OR_MIXED_CHANGE")
                  lines.append(f"- {hunk[0]}: {kind}; non-include context lines present in BSP {matched}/{len(anchors)}; new include directives already present {existing}/{len(added_includes)}")
                  if include_additions:
                      lines.append(f"  - Includes added: {len(include_additions)}; other nonblank additions: {len(other_additions)}; removed lines: {len(removed)}")
                      for directive in include_additions:
                          lines.append(f"  - Header: \`{directive}\`; present in pristine BSP: {'yes' if directive in [y.strip() for y in src] else 'no'}")
                  if file in {"fs/namei.c", "fs/proc/base.c", "fs/proc/task_mmu.c", "mm/memory.c"} and (matched != len(anchors) or include_additions):
                      lines.append("  - REVIEW REQUIRED: positional/context match is not proof of semantic equivalence")
                  if include_only or additive_include_only:
                      lines.append("  - Context-only drift candidate; include dependencies and build still require verification")
              lines.append("")
          report="\n".join(lines)+"\n"
          Path("susfs-context-drift.md").write_text(report)
          print(report)
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as f:f.write(report)
          PY
          echo "BLOCK: classification is diagnostic, not permission to drop or fuzz hunks"
  gitlab-transport:
    # Upstream GitLab is intermittent (#11): no automatic retries on PR/push.
    # Explicit manual source-only dispatch can retry once when appropriate.
    # Do NOT unblock full SUSFS audit or initiate a build.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch Simonpunk SUSFS exact pinned commit from official GitLab
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_TERMINAL_PROMPT=0
          pin=5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          expected_tree=b39cd4117178ce73d2973f7bcdae5c74defc8f68
          upstream=https://gitlab.com/simonpunk/susfs4ksu.git
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git -C "$tmp" init -q
          if ! timeout 105 git -C "$tmp" -c http.version=HTTP/1.1 fetch --depth=1 "$upstream" "$pin"; then
            echo "::error::Official GitLab exact-SHA transport did not succeed from GitHub runner"
            echo "BLOCK: this does not by itself establish a GitLab.com-wide outage"
            exit 1
          fi
          git -C "$tmp" checkout --quiet --detach FETCH_HEAD
          actual_sha="$(git -C "$tmp" rev-parse HEAD)"
          actual_tree="$(git -C "$tmp" rev-parse 'HEAD^{tree}')"
          [[ "$actual_sha" == "$pin" ]] || { echo "::error::Pinned commit mismatch"; exit 1; }
          [[ "$actual_tree" == "$expected_tree" ]] || { echo "::error::Pinned tree mismatch"; exit 1; }
          for source in \
            kernel_patches/50_add_susfs_in_gki-android14-6.1.patch \
            kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch \
            kernel_patches/include/linux/susfs_def.h; do
            test -s "$tmp/$source" || { echo "::error::Missing pinned upstream source: $source"; exit 1; }
            sha256sum "$tmp/$source"
          done
          echo "===== OFFICIAL SUSFS EXECVE SEMANTICS (PINNED) ====="
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          companion=(root/"kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch").read_text(errors="replace").splitlines()
          kernel=(root/"kernel_patches/50_add_susfs_in_gki-android14-6.1.patch").read_text(errors="replace").splitlines()
          def sections(lines):
              found=[]
              for line in lines:
                  if line.startswith("diff --git "):
                      found.append([])
                  if found:
                      found[-1].append(line)
              return found
          for label, lines, token, limit in [
              ("KSUN companion POST EXEC",companion,"ksu_handle_post_execveat_sucompat",170),
              ("KSUN companion REBOOT/FD",companion,"ksu_install_fd",100),
              ("KERNEL fs/exec.c",kernel,"diff --git a/fs/exec.c",150),
              ("KERNEL fs/namei.c",kernel,"diff --git a/fs/namei.c",110),
          ]:
              matching=[s for s in sections(lines) if any(token in x for x in s)]
              print("=== "+label+": matches="+str(len(matching))+" ===",flush=True)
              for s in matching[:3]:
                  print("FILE",s[0],flush=True)
                  if token.startswith("diff --git"):
                      show=s[:limit]
                  else:
                      keep={0}
                      for i,x in enumerate(s):
                          if token in x:
                              keep.update(range(max(0,i-18),min(len(s),i+37)))
                      show=[f"{i+1}: {s[i]}" for i in sorted(keep)[:limit]]
                  for line in show:
                      print(line,flush=True)
                  if len(s)>len(show):print("... section truncated (evidence only)",flush=True)
          print("END OFFICIAL SUSFS PATCH EXCERPTS — NO SOURCE MODIFICATION",flush=True)
          PY
          {
            echo "### Simonpunk GitLab pinned-source availability"
            echo
            echo "- Exact pinned SUSFS SHA: $actual_sha"
            echo "- Exact verified Git tree: $actual_tree"
            echo "- Official GitLab fetch: successful from GitHub runner"
            echo "- Source NOT patched, built, integrated, uploaded or flashed."
            echo "- KSUN/SUSFS compatibility and PR #9 release: STILL BLOCKED."
          } >> "$GITHUB_STEP_SUMMARY"

  susfs-core-layout:
    name: SUSFS pinned core source and Kconfig layout (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect immutable upstream source layout
        shell: bash
        run: |
          set -Eeuo pipefail
          export GIT_TERMINAL_PROMPT=0
          pin=5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          tree=b39cd4117178ce73d2973f7bcdae5c74defc8f68
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git init -q "$tmp/susfs"
          git -C "$tmp/susfs" remote add origin https://gitlab.com/simonpunk/susfs4ksu.git
          timeout 105 git -C "$tmp/susfs" -c http.version=HTTP/1.1 fetch --quiet --depth=1 origin "$pin"
          git -C "$tmp/susfs" checkout -q --detach FETCH_HEAD
          test "$(git -C "$tmp/susfs" rev-parse HEAD)" = "$pin"
          test "$(git -C "$tmp/susfs" rev-parse 'HEAD^{tree}')" = "$tree"
          python3 - "$tmp/susfs" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          files = [p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file() and ".git" not in p.parts]
          core = [p for p in files if p.endswith("/susfs.c") or p == "susfs.c"]
          headers = [p for p in files if p.endswith(("/susfs.h", "/susfs_def.h"))]
          kconfigs = [p for p in files if p.endswith("Kconfig")]
          patch = root / "kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          if not patch.is_file():
              raise SystemExit("BLOCK: official kernel 6.1 patch missing")
          lines = patch.read_text(errors="replace").splitlines()
          references = [line for line in lines if "CONFIG_KSU_SUSFS" in line or "susfs.o" in line or "susfs_def.h" in line]
          print("SUSFS core source candidates:", core)
          print("SUSFS header candidates:", headers)
          print("Upstream Kconfig files:", kconfigs)
          print("Official patch references:")
          for line in references[:35]:
              print(line)
          if not core or not headers or not references:
              raise SystemExit("BLOCK: incomplete SUSFS core/header/Kconfig linkage evidence")
          print("PASS: pinned source layout evidence found; integration, compile, ABI and runtime remain unproven")
          PY
