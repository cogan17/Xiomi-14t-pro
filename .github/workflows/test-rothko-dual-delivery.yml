name: Cogan Rothko - Dual Delivery Candidate Tests

on:
  pull_request:
    branches:
      - dev/rothko
    paths:
      - 'scripts/rothko_dual_package.py'
      - 'tests/test_rothko_dual_package.py'
      - 'tools/platform-tools/**'
      - '.github/workflows/test-rothko-dual-delivery.yml'
  push:
    branches:
      - dev/rothko
    paths:
      - 'scripts/rothko_dual_package.py'
      - 'tests/test_rothko_dual_package.py'
      - 'tools/platform-tools/**'
      - '.github/workflows/test-rothko-dual-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-package-tests:
    name: Validate APK-free AK3 and fastboot image candidate contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/rothko_dual_package.py
            tests/test_rothko_dual_package.py
            tools/platform-tools/
          sparse-checkout-cone-mode: false
      - name: Run local mock packaging tests (no real image, no flash)
        run: python3 -m unittest discover -s tests -p 'test_rothko_dual_package.py' -v
      - name: Check Windows CMD launcher target
        run: |
          grep -Fq 'Flash-Rothko.ps1' tools/platform-tools/flash-rothko.cmd
          grep -Fq 'approved_for_flash' tools/platform-tools/Flash-Rothko.ps1
          grep -Fq 'flash boot_a' tools/platform-tools/Flash-Rothko.ps1
          grep -Fq 'ANDROID!' tools/platform-tools/Flash-Rothko.ps1

  windows-platform-tools-syntax:
    name: Validate Windows PowerShell installer syntax (no flash)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/platform-tools/
          sparse-checkout-cone-mode: false
      - name: Parse Flash-Rothko.ps1 without executing it
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/platform-tools/Flash-Rothko.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell parser PASS; no fastboot command executed.'
