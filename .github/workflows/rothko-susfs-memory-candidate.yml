      - name: Validate task_mmu maps spoof candidate after prior isolated ports
        shell: bash
        run: |
          set -Eeuo pipefail
          base=b2d8b54a0d8bb002d32dda24e58d2b5d0423546b
          test "$(git -C bsp rev-parse HEAD)" = "$base"
          pin=5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
