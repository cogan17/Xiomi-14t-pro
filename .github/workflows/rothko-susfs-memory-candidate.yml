name: Rothko SUSFS memory candidate patch check (isolated)
on:
  push:
    branches:
      - feat/rothko-ksun-susfs-compat-audit
    paths:
      - patches/rothko-susfs-memory-include-candidate.patch
      - .github/workflows/rothko-susfs-memory-candidate.yml
  pull_request:
    paths:
      - patches/rothko-susfs-memory-include-candidate.patch
      - .github/workflows/rothko-susfs-memory-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: dev/rothko
          path: bsp
      - name: Verify exact pinned SUSFS header prerequisite
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q susfs
          timeout 105 git -C susfs -c http.version=HTTP/1.1 fetch --quiet --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git 5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          git -C susfs checkout -q --detach FETCH_HEAD
          test "$(git -C susfs rev-parse HEAD)" = 5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          test "$(git -C susfs rev-parse 'HEAD^{tree}')" = b39cd4117178ce73d2973f7bcdae5c74defc8f68
          test -s susfs/kernel_patches/include/linux/susfs_def.h
          echo "PASS: required header exists in exact pinned SUSFS tree; not yet integrated"
      - name: Check and apply candidate only inside disposable checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-memory-include-candidate.patch"
          echo "Pristine BSP: $(git -C bsp rev-parse HEAD)"
          # Stage the exact upstream header only in the disposable BSP tree.
          # This tests dependency availability, not complete SUSFS integration.
          mkdir -p bsp/include/linux
          cp susfs/kernel_patches/include/linux/susfs_def.h bsp/include/linux/susfs_def.h
          test -s bsp/include/linux/susfs_def.h
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          git -C bsp diff -- mm/memory.c
          test "$(git -C bsp diff --name-only)" = "mm/memory.c"
          test -f bsp/include/linux/susfs_def.h
          grep -q '^#include <linux/susfs_def.h>$' bsp/mm/memory.c
          echo "PASS: isolated include candidate applies cleanly; no compile or semantic approval"
          {
            echo "### Isolated SUSFS memory include candidate"
            echo "- Patch applicability: PASS on disposable BSP checkout"
            echo "- Modified file: mm/memory.c only (temporary runner workspace)"
            echo "- Full SUSFS integration, header dependencies, VMA behavior and security: NOT CLEARED"
            echo "- No kernel build, release, merge or flash"
          } >> "$GITHUB_STEP_SUMMARY"
