            echo "- Eighth independently reversible candidate, applied after previous seven in disposable checkout only"
            echo "- Legacy i_op->readlink and ordinary get_link fallback retained; delayed_call release checked"
            echo "- Official pinned SUSFS helper occurrence verified"
