name: Rothko SUSFS isolated proc and memory candidates
on:
  push:
    branches:
      - feat/rothko-ksun-susfs-compat-audit
    paths:
      - patches/rothko-susfs-memory-include-candidate.patch
      - patches/rothko-susfs-memory-vma-candidate.patch
      - patches/rothko-susfs-memory-integrated-candidate.patch
      - patches/rothko-susfs-task-mmu-smap-candidate.patch
      - patches/rothko-susfs-task-mmu-rollup-candidate.patch
      - patches/rothko-susfs-task-mmu-pagemap-candidate.patch
      - patches/rothko-susfs-proc-map-files-candidate.patch
      - patches/rothko-susfs-proc-readlink-redirect-candidate.patch
      - patches/rothko-susfs-namei-walk-guard-candidate.patch
      - patches/rothko-susfs-namei-vfs-readlink-candidate.patch
      - .github/workflows/rothko-susfs-memory-candidate.yml
  pull_request:
    paths:
      - patches/rothko-susfs-memory-include-candidate.patch
      - patches/rothko-susfs-memory-vma-candidate.patch
      - patches/rothko-susfs-memory-integrated-candidate.patch
      - patches/rothko-susfs-task-mmu-smap-candidate.patch
      - patches/rothko-susfs-task-mmu-rollup-candidate.patch
      - patches/rothko-susfs-task-mmu-pagemap-candidate.patch
      - patches/rothko-susfs-proc-map-files-candidate.patch
      - patches/rothko-susfs-proc-readlink-redirect-candidate.patch
      - patches/rothko-susfs-namei-walk-guard-candidate.patch
      - patches/rothko-susfs-namei-vfs-readlink-candidate.patch
      - .github/workflows/rothko-susfs-memory-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: candidate
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            patches/rothko-susfs-memory-integrated-candidate.patch
            patches/rothko-susfs-task-mmu-smap-candidate.patch
            patches/rothko-susfs-task-mmu-rollup-candidate.patch
            patches/rothko-susfs-task-mmu-pagemap-candidate.patch
            patches/rothko-susfs-proc-map-files-candidate.patch
            patches/rothko-susfs-proc-readlink-redirect-candidate.patch
            patches/rothko-susfs-namei-walk-guard-candidate.patch
            patches/rothko-susfs-namei-vfs-readlink-candidate.patch
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: dev/rothko
          path: bsp
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            mm/memory.c
            fs/proc/task_mmu.c
            fs/proc/base.c
            fs/namei.c
      - name: Verify exact pinned SUSFS header prerequisite
        shell: bash
        run: |
          set -Eeuo pipefail
          git init -q susfs
          timeout 105 git -C susfs -c http.version=HTTP/1.1 fetch --quiet --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git 5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          git -C susfs checkout -q --detach FETCH_HEAD
          test "$(git -C susfs rev-parse HEAD)" = 5192aa2d33b381b58c1051532f9e1dfa5de6e8d3
          test "$(git -C susfs rev-parse 'HEAD^{tree}')" = b39cd4117178ce73d2973f7bcdae5c74defc8f68
          test -s susfs/kernel_patches/include/linux/susfs_def.h
          # The candidate guard must resolve against the pinned upstream definition.
          grep -Fq 'SUSFS_IS_INODE_SUS_MAP' susfs/kernel_patches/include/linux/susfs_def.h
          grep -Fq 'SUSFS_IS_INODE_OPEN_REDIRECT' susfs/kernel_patches/include/linux/susfs_def.h
          grep -Fq 'susfs_open_redirect_spoof_do_proc_readlink' susfs/kernel_patches/fs/susfs.c
          grep -Fq 'susfs_open_redirect_spoof_do_proc_readlink' susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
          grep -Fq 'susfs_is_inode_sus_path' susfs/kernel_patches/fs/susfs.c
          grep -Fq 'susfs_is_inode_sus_path' susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
          grep -Fq 'susfs_open_redirect_spoof_vfs_readlink' susfs/kernel_patches/fs/susfs.c
          grep -Fq 'susfs_open_redirect_spoof_vfs_readlink' susfs/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
      - name: Validate memory candidate in disposable BSP checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C bsp rev-parse HEAD)" = b2d8b54a0d8bb002d32dda24e58d2b5d0423546b
          patch_dir="$GITHUB_WORKSPACE/candidate/patches"
          mkdir -p bsp/include/linux
          cp susfs/kernel_patches/include/linux/susfs_def.h bsp/include/linux/susfs_def.h
          test -s bsp/include/linux/susfs_def.h
          patch="$patch_dir/rothko-susfs-memory-integrated-candidate.patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          test "$(git -C bsp diff --name-only)" = "mm/memory.c"
          grep -Fq '#include <linux/susfs_def.h>' bsp/mm/memory.c
          grep -Fq 'SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))' bsp/mm/memory.c
          # Narrow structural safety check: guard must run before GUP pins a page.
          python3 - <<'PY'
          from pathlib import Path
          src = Path("bsp/mm/memory.c").read_text()
          start = src.index("int __access_remote_vm(")
          end = src.index("\n}", start)
          body = src[start:end]
          loop = body.index("while (len) {")
          guard = body.index("SUSFS_IS_INODE_SUS_MAP(", loop)
          gup = body.index("get_user_pages_remote(", loop)
          assert loop < guard < gup, "VMA guard must precede page pinning"
          before = body[loop:guard]
          assert "#ifdef CONFIG_KSU_SUSFS_SUS_MAP" in before, "guard must be feature-gated"
          assert "vma = vma_lookup(mm, addr);" in before, "guard must refresh VMA"
          assert "struct page *page = NULL;" in before, "page pointer must start NULL"
          assert "mmap_read_lock_killable(mm)" in body[:loop], "mmap lock must precede loop"
          assert "mmap_read_unlock(mm)" in body[gup:], "mmap unlock must remain"
          print("PASS: structural guard ordering and feature gate (not semantic clearance)")
          PY
          echo "PASS: integrated candidate apply in isolated BSP; not a compile, behavior or security approval"
          {
            echo "### Isolated memory candidates"
            echo "- One integrated patch applied to temporary BSP checkout"
            echo "- Only tracked change: mm/memory.c"
            echo "- Pinned SUSFS header staged as untracked dependency"
            echo "- No build, release, merge, flash or semantic clearance"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate smaps candidate in the same disposable BSP checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-task-mmu-smap-candidate.patch"
          test -s "$patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          changed="$(git -C bsp diff --name-only)"
          test "$changed" = "$(printf 'fs/proc/task_mmu.c\nmm/memory.c')"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("bsp/fs/proc/task_mmu.c").read_text()
          start = source.index("static int show_smap(")
          end = source.index("static int show_smaps_rollup(", start)
          body = source[start:end]
          guard = body.index("#ifdef CONFIG_KSU_SUSFS_SUS_MAP")
          cond = body.index("SUSFS_IS_INODE_SUS_MAP(", guard)
          early_return = body.index("return 0;", cond)
          accounting = body.index("smap_gather_stats(")
          mapping = body.index("show_map_vma(")
          assert guard < cond < early_return < accounting < mapping
          assert "vma->vm_file &&" in body[guard:cond]
          assert "#endif" in body[cond:accounting]
          assert "trace_android_vh_show_smap(" in source, "vendor show_smap hook lost"
          assert "static int show_smaps_rollup(" in source, "rollup entry lost"
          print("PASS: isolated smaps candidate applies and guard precedes accounting")
          print("NOTE: not a behavioral, semantic, ABI, or runtime safety approval")
          PY
          {
            echo "### Isolated proc smaps candidate"
            echo "- task_mmu.c applied only in disposable checkout (alongside memory.c)"
            echo "- SUSFS official header prerequisite verified by pinned source SHA and tree"
            echo "- Both patches are isolated candidates; behavioral equivalence unproven"
            echo "- Release gate remains blocked: execve/FD/SELinux/TIF, ABI/KMI and build"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate rollup candidate without changing protected BSP
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-task-mmu-rollup-candidate.patch"
          test -s "$patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          test "$(git -C bsp diff --name-only)" = "$(printf 'fs/proc/task_mmu.c\nmm/memory.c')"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("bsp/fs/proc/task_mmu.c").read_text()
          start = source.index("static int show_smaps_rollup(")
          end = source.index("#undef SEQ_PUT_DEC", start)
          body = source[start:end]
          assert body.count("SUSFS_IS_INODE_SUS_MAP(") == 2, "two rollup accounting guards required"
          first_stats = body.index("smap_gather_stats(vma, &mss, 0);")
          first_guard = body.rfind("SUSFS_IS_INODE_SUS_MAP(", 0, first_stats)
          assert 0 <= first_guard < first_stats, "initial VMA guard missing"
          case4 = body.index("/* Case 4 above */")
          last_stats = body.index("smap_gather_stats(vma, &mss, last_vma_end);")
          last_guard = body.rfind("SUSFS_IS_INODE_SUS_MAP(", case4, last_stats)
          assert case4 < last_guard < last_stats, "post-relock VMA guard missing"
          assert "if (vma->vm_end > last_vma_end) {" in body, "case 4 boundary check lost"
          assert "last_vma_end = vma->vm_end;" in body, "VMA boundary tracking lost"
          assert "mmap_read_unlock(mm)" in body, "mmap locking path lost"
          assert "release_task_mempolicy(priv)" in body, "mempolicy cleanup lost"
          print("PASS: both rollup accounting paths filtered, with VMA iteration and cleanup anchors present")
          print("NOTE: static structural probe only; no complete semantic or runtime validation")
          PY
          {
            echo "### Isolated smaps_rollup candidate"
            echo "- Added third candidate as a separate reversible patch on temporary BSP"
            echo "- Normal VMA accounting and post-relock case-4 accounting checked"
            echo "- No source kernel checkout committed, no device build, no flash artifact"
            echo "- Security and ABI release gates remain blocked"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate pagemap candidate with lock and progress checks
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-task-mmu-pagemap-candidate.patch"
          test -s "$patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          test "$(git -C bsp diff --name-only)" = "$(printf 'fs/proc/task_mmu.c\nmm/memory.c')"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("bsp/fs/proc/task_mmu.c").read_text()
          start = source.index("static ssize_t pagemap_read(")
          end = source.index("static int pagemap_open(", start)
          body = source[start:end]
          assert body.count("SUSFS_IS_INODE_SUS_MAP(") == 1, "expected one pagemap guard"
          loop = body.index("while (count && (start_vaddr < end_vaddr))")
          reset = body.index("pm.pos = 0;", loop)
          lock = body.index("ret = mmap_read_lock_killable(mm);", loop)
          fail = body.index("goto out_free;", lock)
          lookup = body.index("vma = vma_lookup(mm, start_vaddr);", fail)
          guard = body.index("SUSFS_IS_INODE_SUS_MAP(", lookup)
          bypass = body.index("goto bypass_orig_flow;", guard)
          walk = body.index("ret = walk_page_range(mm, start_vaddr, end, &pagemap_ops, &pm);", bypass)
          label = body.index("bypass_orig_flow:", walk)
          unlock = body.index("mmap_read_unlock(mm);", label)
          progress = body.index("start_vaddr = end;", unlock)
          output = body.index("len = min(count, PM_ENTRY_BYTES * pm.pos);", progress)
          assert loop < reset < lock < fail < lookup < guard < bypass < walk < label < unlock < progress < output
          assert "vma && vma->vm_file &&" in body[lookup:bypass], "null file guard lost"
          assert "#ifdef CONFIG_KSU_SUSFS_SUS_MAP" in body[fail:lookup], "feature gate missing"
          assert "#ifdef CONFIG_KSU_SUSFS_SUS_MAP" in body[walk:label], "bypass label should be guarded"
          assert "copy_to_user(buf, pm.buffer, len)" in body[output:], "copy path lost"
          assert "count -= len;" in body[output:], "copy accounting lost"
          print("PASS: pinned-style pagemap VMA guard applies in disposable checkout")
          print("PASS: bypass path still unlocks mmap and advances address; output accounting remains")
          print("BLOCK: page-range coverage and zero-byte/EOF semantics not runtime-verified")
          PY
          {
            echo "### Isolated pagemap candidate"
            echo "- Pinned-style source candidate applied with prior three patches in disposable BSP only"
            echo "- Read-lock, bypass-unlock, address progress, and copy accounting anchors checked"
            echo "- Remaining behavioral risks: mixed-visibility range, partial reads, zero-length/EOF behavior"
            echo "- No device kernel build, ABI/KMI approval, release, or flash"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate proc map_files VMA candidate in isolated BSP
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-proc-map-files-candidate.patch"
          test -s "$patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          test "$(git -C bsp diff --name-only)" = "$(printf 'fs/proc/base.c\nfs/proc/task_mmu.c\nmm/memory.c')"
          python3 - <<'PY'
          from pathlib import Path
          src = Path("bsp/fs/proc/base.c").read_text()
          assert "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>\n#endif" in src
          start = src.index("proc_map_files_readdir(")
          end = src.index("static const struct file_operations proc_map_files_operations", start)
          body = src[start:end]
          lock = body.index("ret = mmap_read_lock_killable(mm);")
          collect = body.index("for_each_vma(vmi, vma)")
          file_check = body.index("if (!vma->vm_file)", collect)
          feature = body.index("#ifdef CONFIG_KSU_SUSFS_SUS_MAP", file_check)
          filtered = body.index("SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))", feature)
          skip = body.index("continue;", filtered)
          pos = body.index("if (++pos <= ctx->pos)", skip)
          entry = body.index("genradix_ptr_alloc(", pos)
          unlock = body.index("mmap_read_unlock(mm);", entry)
          assert lock < collect < file_check < feature < filtered < skip < pos < entry < unlock
          assert "vma_iter_init(&vmi, mm, 0);" in body[:collect]
          assert "for (i = 0; i < nr_files; i++)" in body[unlock:]
          assert "ctx->pos++;" in body[unlock:]
          print("PASS: isolated proc map_files guard applies before position and entry allocation")
          print("PASS: mmap lock and visible entry emission anchors retained")
          print("NOTE: structural source test only; no directory iteration runtime evidence")
          PY
          {
            echo "### Isolated proc map_files candidate"
            echo "- Fifth independently reversible candidate applied only in disposable BSP"
            echo "- Guard precedes visible mapping position and radix entry creation"
            echo "- mmap lock and original emission paths retained by structural assertions"
            echo "- Neither VFS behavior nor whole SUSFS integration is approved for devices"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate bounded proc readlink OPEN_REDIRECT candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-proc-readlink-redirect-candidate.patch"
          test -s "$patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          test "$(git -C bsp diff --name-only)" = "$(printf 'fs/proc/base.c\nfs/proc/task_mmu.c\nmm/memory.c')"
          python3 - <<'PY'
          from pathlib import Path
          src = Path("bsp/fs/proc/base.c").read_text()
          assert "#if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif" in src
          begin = src.index("static int do_proc_readlink(")
          end = src.index("static int proc_pid_readlink(", begin)
          body = src[begin:end]
          assert "kmalloc(PATH_MAX, GFP_KERNEL)" in body
          allocated = body.index("if (!tmp)")
          enable = body.index("#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT", allocated)
          limit = body.index("min_t(int, buflen, PATH_MAX - 1)", enable)
          clear = body.index("memset(tmp, 0, PATH_MAX);", limit)
          helper = body.index("susfs_open_redirect_spoof_do_proc_readlink(inode, tmp, limit)", clear)
          check_len = body.index("strnlen(tmp, PATH_MAX)", helper)
          bound = body.index("min_t(size_t, spoof_len, (size_t)buflen)", check_len)
          usercopy = body.index("copy_to_user(buffer, tmp, len)", bound)
          fallback = body.index("pathname = d_path(path, tmp, PATH_MAX);", usercopy)
          release = body.index("kfree(tmp);", fallback)
          assert allocated < enable < limit < clear < helper < check_len < bound < usercopy < fallback < release
          assert "buflen > 0" in body[enable:limit], "zero-length guard missing"
          assert "spoof_len == PATH_MAX" in body[helper:bound], "unterminated helper buffer not rejected"
          assert "len = -EOVERFLOW;" in body[check_len:bound], "overflow error path missing"
          assert "len = -EFAULT;" in body[usercopy:fallback], "user copy error path missing"
          assert "goto out;" in body[usercopy:fallback], "success cleanup bypass missing"
          assert "if (IS_ERR(pathname))" in body[fallback:], "ordinary readlink fallback lost"
          print("PASS: pinned helper and bounded redirect candidate apply in disposable BSP")
          print("PASS: capped helper length, initialized buffer, bounded usercopy, d_path fallback")
          print("BLOCK: helper runtime return semantics, concurrent inode state, and full VFS integration unproven")
          PY
          {
            echo "### Isolated proc readlink OPEN_REDIRECT candidate"
            echo "- The sixth source-only patch layers on existing proc map_files candidate"
            echo "- Helper name checked against exact pinned upstream SUSFS source and patch"
            echo "- Initialized temporary kernel buffer, length limits, error handling, fallback/cleanup anchors checked"
            echo "- This is NOT a complete semantic proof, compiled source tree, or permission to ship/flash"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate source-only namei SUS_PATH traversal guard
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-namei-walk-guard-candidate.patch"
          test -s "$patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          test "$(git -C bsp diff --name-only)" = "$(printf 'fs/namei.c\nfs/proc/base.c\nfs/proc/task_mmu.c\nmm/memory.c')"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("bsp/fs/namei.c").read_text()
          include = "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n#include <linux/susfs_def.h>\n#endif"
          assert include in source, "feature-gated official SUSFS header not present"
          assert "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\nextern bool susfs_is_inode_sus_path(struct inode *inode);\n#endif" in source, "upstream helper declaration absent"
          start = source.index("static int link_path_walk(")
          end = source.index("\n}\n", start)
          body = source[start:end]
          enter = body.index("for(;;) {")
          declaration = body.index("struct dentry *dentry = nd->path.dentry;", enter)
          feature = body.rfind("#ifdef CONFIG_KSU_SUSFS_SUS_PATH", enter, declaration)
          inode = body.index("d_inode(dentry)", declaration)
          call = body.index("susfs_is_inode_sus_path(d_inode(dentry))", inode)
          reject = body.index("return -ENOENT;", call)
          close = body.index("#endif", reject)
          permission = body.index("err = may_lookup(mnt_userns, nd);", close)
          assert enter < feature < declaration < inode < call < reject < close < permission
          assert "if (dentry && d_inode(dentry) &&" in body[declaration:call], "null checks missing"
          assert "dput(dentry)" not in body[feature:close], "must not drop path-owned dentry"
          assert "if (IS_ERR(name))" in body[:enter], "error name early check must remain"
          assert "if (!*name)" in body[:enter], "root/empty path early exit must remain"
          assert "hash_len = hash_name(nd->path.dentry, name);" in body[permission:], "normal name hashing lost"
          assert "return -ENOENT;" in body[call:close], "hidden-path rejection missing"
          print("PASS: isolated namei SUS_PATH candidate applies on pinned pristine Rothko BSP")
          print("PASS: traversal guard is feature-gated, precedes may_lookup, and preserves owned dentry")
          print("BLOCK: lookup_fast, slow lookup, openat and full-name resolution semantics remain unported")
          PY
          {
            echo "### Source-only namei SUS_PATH traversal candidate"
            echo "- Seventh independently removable patch candidate; previous six source-only checks retained"
            echo "- Guard added before may_lookup inside link_path_walk only; no dentry dput"
            echo "- Source and helper symbol verified against exact pinned official SUSFS upstream"
            echo "- No full namei patch, no kernel compile, security clearance, ABI/KMI approval or flash"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate isolated VFS readlink redirection paths
        shell: bash
        run: |
          set -Eeuo pipefail
          patch="$GITHUB_WORKSPACE/candidate/patches/rothko-susfs-namei-vfs-readlink-candidate.patch"
          test -s "$patch"
          git -C bsp apply --check "$patch"
          git -C bsp apply "$patch"
          git -C bsp diff --check
          test "$(git -C bsp diff --name-only)" = "$(printf 'fs/namei.c\nfs/proc/base.c\nfs/proc/task_mmu.c\nmm/memory.c')"
          python3 - <<'PY'
          from pathlib import Path
          src = Path("bsp/fs/namei.c").read_text()
          assert "#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif" in src
          assert "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\nextern int susfs_open_redirect_spoof_vfs_readlink(struct inode *inode," in src
          start = src.index("int vfs_readlink(")
          stop = src.index("EXPORT_SYMBOL(vfs_readlink);", start)
          body = src[start:stop]
          helper = "susfs_open_redirect_spoof_vfs_readlink(inode, buffer, buflen)"
          assert body.count(helper) == 2, "both original readlink paths must have their own guarded helper"
          assert body.count("if (SUSFS_IS_INODE_OPEN_REDIRECT(inode))") == 2
          fallback = body.index("return inode->i_op->readlink(dentry, buffer, buflen);")
          early_helper = body.index(helper)
          early_success = body.index("if (!res)", early_helper)
          assert early_helper < early_success < fallback, "legacy i_op fallback/return missing"
          assert "#ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT" in body[:early_helper]
          lookup = body.index("link = READ_ONCE(inode->i_link);")
          getlink = body.index("link = inode->i_op->get_link(dentry, inode, &done);", lookup)
          next_helper = body.index(helper, getlink)
          next_success = body.index("if (!res)", next_helper)
          cleanup_success = body.index("do_delayed_call(&done);", next_success)
          success_return = body.index("return res;", cleanup_success)
