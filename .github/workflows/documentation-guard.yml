name: Cogan Rothko - Documentation Guard

# PR-only audit of documentation obligations. No kernel build or flash.
on:
  pull_request:
    branches:
      - dev/rothko
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'drivers/**'
      - 'fs/**'
      - 'include/**'
      - 'kernel/**'
      - 'arch/**'
      - 'docs/**'
      - '.github/pull_request_template.md'
      - 'Makefile'
      - 'build.config*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Require worklog for non-documentation changes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect changed files via GitHub REST API (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPO"]
          pr = os.environ.get("PR_NUMBER", "")
          event = os.environ["EVENT_NAME"]
          if event != "pull_request":
              print("Manual dispatch: documentation guard smoke check only.")
              raise SystemExit(0)
          if not pr.isdigit():
              raise SystemExit("Missing PR number.")
          token = os.environ["GH_TOKEN"]
          filenames = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/pulls/{pr}/files?per_page=100&page={page}"
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  batch = json.load(response)
              filenames.extend(item["filename"] for item in batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 30:
                  raise SystemExit("Too many PR files for safe audit.")
          if not filenames:
              raise SystemExit("No files returned for pull request.")
          docs_only = all(f.startswith("docs/") or f == ".github/pull_request_template.md"
                          for f in filenames)
          worklog_changed = "docs/WORKLOG.md" in filenames
          print(f"Changed files: {len(filenames)}")
          print(f"Documentation-only: {docs_only}")
          print(f"Worklog updated: {worklog_changed}")
          if not docs_only and not worklog_changed:
              print("::error::This PR changes non-documentation files but does not update docs/WORKLOG.md.")
              raise SystemExit(1)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# Cogan documentation guard\n\n")
              f.write(f"Files examined: {len(filenames)}\n\n")
              f.write(f"Documentation only: {docs_only}\n\n")
              f.write(f"Worklog included: {worklog_changed}\n")
          PY
