name: Cogan Rothko - Verify Root Sources (No Build)

# Source audit only. No setup script execution, kernel patch, APK, release or flashable image.
on:
  push:
    branches:
      - dev/rothko
      - fix/rothko-root-source-pin-audit
    paths:
      - '.github/workflows/validate-root-sources.yml'
  pull_request:
    branches:
      - dev/rothko
    paths:
      - '.github/workflows/validate-root-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    name: Audit ${{ matrix.flavor }} (no build)
    if: github.ref == 'refs/heads/dev/rothko' || (github.event_name == 'pull_request' && github.head_ref == 'fix/rothko-root-source-pin-audit') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/rothko-root-source-pin-audit') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/rothko-root-source-pin-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: KSUN
            repository: KernelSU-Next/KernelSU-Next
            source_branch: dev
            source_sha: 02a9e1c5fb2c4fd8117429fe004136332788c1b6
          - flavor: BakaSU
            repository: Baka-SU/BakaSU
            source_branch: main
            source_sha: f6cb7e70c10ebde149f3121ae68b945514fd0801

    env:
      ROOT_FLAVOR: ${{ matrix.flavor }}
      SOURCE_REPO: ${{ matrix.repository }}
      SOURCE_BRANCH: ${{ matrix.source_branch }}
      SOURCE_SHA: ${{ matrix.source_sha }}

    steps:
      - name: Verify pinned commit and report upstream drift
        shell: bash
        run: |
          set -euo pipefail
          remote_url="https://github.com/$SOURCE_REPO.git"
          remote_sha="$(git ls-remote --exit-code "$remote_url" "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pinned SHA for $ROOT_FLAVOR"
            exit 1
          fi
          # Verify the immutable pinned commit via GitHub's commit API.
          # A moving branch tip must never silently replace the audited source.
          status="$(curl --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 -o "$RUNNER_TEMP/pinned-commit.json" -w '%{http_code}' "https://api.github.com/repos/$SOURCE_REPO/commits/$SOURCE_SHA")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Pinned commit $SOURCE_SHA for $ROOT_FLAVOR is unavailable (HTTP $status)"
            exit 1
          fi
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "::warning::Upstream $ROOT_FLAVOR branch moved to $remote_sha; audited pin remains $SOURCE_SHA. Review changes separately."
          fi
          {
            echo "### $ROOT_FLAVOR upstream pin"
            echo "Pinned commit: \`$SOURCE_SHA\`"
            echo "Current upstream branch HEAD: \`$remote_sha\`"
            echo "Pin unchanged; no automatic upgrade."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download exact pinned integration source (never execute scripts)
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/rothko-root-source-audit/$ROOT_FLAVOR"
          mkdir -p "$workdir"
          for file in setup.sh Kconfig Makefile; do
            url="https://raw.githubusercontent.com/$SOURCE_REPO/$SOURCE_SHA/kernel/$file"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 "$url" -o "$workdir/$file"
            test -s "$workdir/$file" || {
              echo "::error::Empty upstream file: kernel/$file"
              exit 1
            }
          done

          # Syntax-check only; do NOT run setup.sh.
          sh -n "$workdir/setup.sh"
          grep -Fq 'drivers/kernelsu/Kconfig' "$workdir/setup.sh" || {
            echo "::error::Missing expected root-driver Kconfig integration"
            exit 1
          }
          grep -Fq 'CONFIG_KSU' "$workdir/setup.sh" || {
            echo "::error::Missing expected CONFIG_KSU integration"
            exit 1
          }
          grep -Eq '^[[:space:]]*config[[:space:]]+KSU([[:space:]]|$)' "$workdir/Kconfig" || {
            echo "::error::Missing KSU configuration entry"
            exit 1
          }

          {
            echo "### Root source static audit: $ROOT_FLAVOR"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Source | $SOURCE_REPO |"
            echo "| Branch | $SOURCE_BRANCH |"
            echo "| Exact commit | \`$SOURCE_SHA\` |"
            echo "| setup.sh shell syntax | PASS |"
            echo "| KernelSU driver integration markers | PASS |"
            echo "| kernel Kconfig and Makefile | Present |"
            echo
            echo "**Scope: source metadata and static sanity checks only.**"
            echo
            echo "No root integration, patches, compiled kernel, manager APK or ZIP."
            echo
            echo "DroidSpaces and NTSync are intentionally excluded."
          } >> "$GITHUB_STEP_SUMMARY"
